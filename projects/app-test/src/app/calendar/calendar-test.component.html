<div class="calendar-test-page">
  <h2>o-calendar</h2>

  <o-calendar
    attr="demoCalendar"
    [static-data]="staticData"
    columns="id;title;code;start;end;allDay"
    keys="id"
    start-column="start"
    end-column="end"
    title-column="title"
    description-column="code"
    all-day-column="allDay"
    view="month"
    views="month;week;day"
    week-starts-on="1"
    (onEventClick)="onEventClick($event)"
    (onDayClick)="onDayClick($event)">
  </o-calendar>
</div>
